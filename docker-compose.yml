# Local development stack: Postgres (with pgvector), Redis and the API.
#   docker compose up -d db redis       # just the databases
#   docker compose up --build           # everything: web on http://localhost:3000, API on :8080
#   docker compose run --rm seed        # import content/library
#   docker compose run --rm seed seed /testdata/library   # import the small dev fixtures
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reborn
      POSTGRES_PASSWORD: reborn
      POSTGRES_DB: reborn
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reborn"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    environment: &api-env
      DATABASE_URL: postgres://reborn:reborn@db:5432/reborn?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CONTENT_DIR: /content/library
      EXPLAINER_DIR: /content/explainers/out
    ports: ["8080:8080"]
    volumes: ["./content:/content:ro", "./backend/testdata:/testdata:ro"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]

  seed:
    build: ./backend
    profiles: [tools]
    environment: *api-env
    volumes: ["./content:/content:ro", "./backend/testdata:/testdata:ro"]
    command: ["seed"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
