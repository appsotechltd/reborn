<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reborn explainer</title>
<style>
  @font-face { font-family: "Reborn Serif"; src: url("fonts/SourceSerif4-Variable.woff2") format("woff2"); font-weight: 200 900; font-style: normal; font-display: block; }
  @font-face { font-family: "Reborn Serif"; src: url("fonts/SourceSerif4-Italic-Variable.woff2") format("woff2"); font-weight: 200 900; font-style: italic; font-display: block; }
  @font-face { font-family: "Reborn Sans"; src: url("fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }

  :root {
    --paper: #f6efe6;
    --paper-2: #efe4d6;
    --ink: #2a211b;
    --muted: #7a6a5d;
    --accent: #8f3b1b;
    --accent-soft: #f2d9c8;
    --apply: #eef4ea;
    --apply-border: #6d8f5a;
    --apply-fg: #2d4421;
    --warn: #fff4d6;
    --warn-border: #d9b44a;
    --warn-fg: #5c4708;
    --serif: "Reborn Serif", Georgia, serif;
    --sans: "Reborn Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 0%, #fbf6ef 0%, var(--paper) 55%, var(--paper-2) 100%); }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; will-change: opacity; }
  svg { display: block; overflow: visible; }
  svg text { font-family: var(--sans); }

  #header { position: absolute; left: 28px; right: 28px; top: 26px; display: flex; justify-content: space-between; align-items: center; }
  #wordmark { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; color: var(--accent); }
  #topic { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  #health { position: absolute; left: 28px; right: 28px; top: 62px; padding: 6px 10px; border-radius: 8px;
    background: var(--warn); border: 1px solid var(--warn-border); color: var(--warn-fg); font-size: 11.5px; font-weight: 600; text-align: center; }


  #footer { position: absolute; left: 28px; right: 28px; bottom: 26px; font-size: 11px; line-height: 1.4; color: var(--muted); text-align: center; }
  #footer b { color: var(--ink); font-weight: 600; }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); }


  /* Dark abstract themes (timeline.theme). Colours come through the same variables,
     and the animated background is drawn on #bgcanvas by backgrounds.js. */
  body[data-theme] { --muted: rgba(240, 236, 255, 0.62); --ink: #f6f3ff; --apply: rgba(255, 255, 255, 0.05);
    --apply-fg: var(--ink); --apply-border: var(--accent); --warn: rgba(255, 196, 77, 0.12); --warn-border: rgba(255, 196, 77, 0.55); --warn-fg: #ffd98a; }
  body[data-theme="voltage"] { --paper: #03040b; --accent: #6fe9ff; --accent-soft: rgba(111, 233, 255, 0.35); --glow: rgba(111, 233, 255, 0.55); --serif: "Reborn Sans", system-ui, sans-serif; }
  body[data-theme="ember"] { --paper: #090403; --ink: #fbf1e4; --muted: rgba(251, 241, 228, 0.62); --accent: #f5b54a; --accent-soft: rgba(245, 181, 74, 0.35); --glow: rgba(255, 140, 50, 0.55); }
  body[data-theme="aurora"] { --paper: #04021a; --accent: #ff6ab8; --accent-soft: rgba(80, 235, 205, 0.4); --glow: rgba(255, 106, 184, 0.5); }
  body[data-theme="swarm"] { --paper: #010108; --accent: #a9c8ff; --accent-soft: rgba(169, 200, 255, 0.35); --glow: rgba(140, 170, 255, 0.55); --serif: "Reborn Sans", system-ui, sans-serif; }
  body[data-theme="depth"] { --paper: #020208; --accent: #ffcf8a; --accent-soft: rgba(110, 150, 255, 0.4); --glow: rgba(255, 190, 110, 0.45); }
  body[data-theme="photo"] { --paper: #000; --accent: #f3c98b; --accent-soft: rgba(243, 201, 139, 0.4); --glow: rgba(255, 190, 120, 0.45); }
  body[data-theme] #stage { background: var(--paper); }
  body[data-theme] .blob { display: none; }
  body[data-theme] .serif, body[data-theme] h1, body[data-theme] blockquote { text-shadow: 0 0 28px var(--glow), 0 2px 12px rgba(0, 0, 0, 0.8); }
  body[data-theme="voltage"] h1, body[data-theme="voltage"] .line { font-weight: 800 !important; letter-spacing: -0.025em; }
  body[data-theme="voltage"] blockquote { font-style: normal !important; font-weight: 600; }
  body[data-theme="aurora"] h1, body[data-theme="aurora"] .line { font-weight: 400 !important; }
  body[data-theme] #wordmark { color: var(--accent); text-shadow: 0 0 14px var(--glow); }
  body[data-theme] #footer b { color: var(--ink); }
  body[data-theme] #progress { box-shadow: 0 0 12px var(--glow); }
  body[data-theme] .box { box-shadow: 0 0 50px -14px var(--glow) !important; border: 1px solid var(--accent-soft); }
  /* Figures and objects in a dark theme become glowing line art in the theme's accent. */
  body[data-theme] .scene svg:not(.raw) { filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 10px var(--glow)); }
  body[data-theme] .scene svg:not(.raw) :is(rect, circle, ellipse, path, line, polygon, polyline) { fill: transparent !important; stroke: var(--accent) !important; stroke-width: 1.6px; }
  body[data-theme] .scene svg:not(.raw) [fill="transparent"] { stroke: none !important; }
  body[data-theme] .scene svg:not(.raw) text { fill: var(--ink) !important; stroke: none !important; }
  #bgcanvas { position: absolute; inset: 0; width: 540px; height: 960px; }

  /* Landscape (16:9): the picture or background fills the wide frame, and the scenes, which are
     drawn for the 540x960 stage, are scaled into the middle so their band (y 100-710) fits
     between the header and the credit. */
  body[data-orient="landscape"], body[data-orient="landscape"] #stage, body[data-orient="landscape"] #bgcanvas { width: 960px; height: 540px; }
  body[data-orient="landscape"] #scenes { width: 540px; height: 960px; inset: auto; left: 0; top: 0; transform-origin: 0 0;
    transform: translate(291px, -8px) scale(0.7); }
  body[data-orient="landscape"] #header { left: 32px; right: 32px; top: 20px; }
  body[data-orient="landscape"] #health { left: 50%; right: auto; top: 18px; transform: translateX(-50%); white-space: nowrap; }
  body[data-orient="landscape"] #footer { left: 32px; right: 32px; bottom: 16px; }

  /* scene helpers */
  .center { position: absolute; left: 36px; right: 36px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
  .serif { font-family: var(--serif); }
  .word { display: inline-block; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"><canvas id="bgcanvas" hidden></canvas></div>
  <div class="layer" id="scenes"></div>
  <div id="header"><div id="wordmark">Reborn</div><div id="topic"></div></div>
  <div id="health" hidden>General information, not medical advice.</div>
  <div id="footer"></div>
  <div id="progress"></div>
</div>
<script src="scenes.js"></script>
<script src="backgrounds.js"></script>
<script src="particles.js"></script>
<script src="depth.js"></script>
<script src="photo.js"></script>
<script src="runtime.js"></script>
</body>
</html>
