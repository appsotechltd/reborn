# Source registry: how each content/library/<id>.json source is fetched, and the licence we expect
# upstream. `python -m reborn_content fetch` re-reads the licence from the upstream files and refuses
# to continue if it isn't the one recorded here (or is non-commercial).
#
# adapter = "standardebooks" | "gutenberg" | "openstax" | "web"
#   standardebooks: repo, optional files (XHTML names, default all bodymatter)
#   gutenberg:      gutenberg_id, optional mirror (GITenberg path), optional start / end markers
#   openstax:       repo, collection, optional chapters
#   web:            url (a page read by hand; cards from it carry no quotes)
#   summary:        url (a copyrighted work: cards are our own summary, licence original-summary, no quotes)
#
# [[candidate]] entries are sources we track but don't use yet (see content/SOURCES.md);
# `python -m reborn_content licences` re-checks their upstream licences.

